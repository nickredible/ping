# Self-hosted ntfy relay for Ping. See ../docs/RELAY.md.
#
#   1. Set base-url in server.yml to your public HTTPS URL.
#   2. docker compose up -d
#   3. docker compose exec ntfy ntfy user add fmb
#      docker compose exec ntfy ntfy access fmb 'fmb-*' rw
#      docker compose exec ntfy ntfy token add fmb      # -> tk_… for the pairing code
#   4. Put it behind an HTTPS reverse proxy with response buffering off.
services:
  ntfy:
    image: binwiederhier/ntfy:v2.x.y   # pin a release; read the changelog before bumping
    command: serve
    restart: unless-stopped
    ports:
      - "2586:80"                     # only expose this to your reverse proxy
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - ./data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
